global:
  smtp_smarthost: "mailpit:1025"
  smtp_from: "alertmanager@crm.local"
  smtp_require_tls: false

route:
  receiver: crm-mailpit
  group_by: [alertname, name]
  group_wait: 15s
  group_interval: 1m
  repeat_interval: 4h

receivers:
  - name: crm-mailpit
    email_configs:
      - to: "admin@localhost"
        send_resolved: true
